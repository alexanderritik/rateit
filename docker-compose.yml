version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catchit
      POSTGRES_PASSWORD: catchit
      POSTGRES_DB: catchit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catchit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
